<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Columbia Machine Brasil V7.2.0</title>

    <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        columbia: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#1d72b8',
                            600: '#155b96',
                            700: '#003e7e',
                            800: '#002e61',
                            900: '#001e40',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-700">
        <!-- CABEÇALHO -->
        <div class="bg-columbia-700 p-8 text-center text-white relative">
            <div class="inline-flex p-3 bg-white rounded-2xl shadow-md mb-3">
                <img src="./logo.png" alt="Columbia Machine" class="h-10 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i data-lucide="factory" class="w-10 h-10 text-columbia-700 hidden"></i>
            </div>
            <h2 class="text-2xl font-black tracking-wide">Columbia Machine</h2>
            <p class="text-xs text-columbia-100 font-medium mt-1">Sistema de Controle de Produção V7.2.0</p>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="loginForm" onsubmit="realizarLogin(event)" class="p-8 space-y-5">
            <div id="errorAlert" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-bold p-3.5 rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 shrink-0"></i>
                <span id="errorMessage">Credenciais inválidas.</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Usuário / Login</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="username" required placeholder="Digite seu usuário..." 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-3.5 py-3 text-xs text-slate-800 focus:outline-none focus:border-columbia-600 font-medium">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="password" id="password" required placeholder="Digite sua senha..." 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-10 py-3 text-xs text-slate-800 focus:outline-none focus:border-columbia-600 font-medium">
                    <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-columbia-700 hover:bg-columbia-800 text-white font-extrabold text-xs py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="bg-slate-50 border-t border-slate-100 p-4 text-center text-[11px] text-slate-400 font-medium">
            © 2026 Consultoria RF & Columbia Machine
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (localStorage.getItem('columbia_token')) {
                window.location.href = 'index.html';
            }
        });

        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.setAttribute('data-lucide', 'eye-off');
            } else {
                pwd.type = 'password';
                eye.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function realizarLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errAlert = document.getElementById('errorAlert');
            const errText = document.getElementById('errorMessage');

            errAlert.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            const formData = new URLSearchParams();
            formData.append('username', usernameInput);
            formData.append('password', passwordInput);

            try {
                const response = await fetch('https://columbia.consultoriarf.net/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Falha ao autenticar.');
                }

                const data = await response.json();

                // V7.2.0: Grava tokens e o codigo do responsavel oriundo da csenha.codigo
                localStorage.setItem('columbia_token', data.access_token);
                localStorage.setItem('columbia_usuario_nome', data.usuario_nome);
                localStorage.setItem('columbia_cod_responsavel', data.cod_responsavel || '');
                localStorage.setItem('columbia_perm_faturamento', data.u_faturamento);
                localStorage.setItem('columbia_perm_finalizacao', data.u_finalizacao);

                window.location.href = 'index.html';

            } catch (error) {
                errText.textContent = error.message;
                errAlert.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
