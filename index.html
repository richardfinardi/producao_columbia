<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
    <link rel="apple-touch-icon" href="LOGO MINIMALISTA.png">

    <meta property="og:title" content="Controle Semanal de Produção | Consultoria RF">
    <meta property="og:description" content="Dashboard de acompanhamento e controle de produção.">
    <meta property="og:image" content="https://consultoriarf.net/producao_columbia/LOGO MINIMALISTA.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta property="og:url" content="https://consultoriarf.net/producao_columbia/">
    <meta property="og:type" content="website">
    
    <title>Programação de Produção - Columbia V7.6.6</title>

    <script>
        if (!localStorage.getItem('columbia_token')) {
            window.location.href = 'login.html';
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        columbia: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#1d72b8',
                            600: '#155b96',
                            700: '#003e7e',
                            800: '#002e61',
                            900: '#001e40',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-800">

    <!-- HEADER -->
    <header class="bg-columbia-700 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex flex-wrap justify-between items-center gap-2 sm:gap-4">
            
            <div class="flex items-center gap-2.5 sm:gap-4">
                <div class="flex items-center justify-center p-1 sm:p-1.5 bg-white rounded-xl shadow-sm cursor-pointer shrink-0" onclick="setAbaAtiva('dashboard')">
                    <img src="./logo.png" alt="Columbia Machine" class="h-7 sm:h-9 max-h-10 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden p-1.5 bg-columbia-700 rounded-lg text-white font-bold items-center justify-center">
                        <i data-lucide="factory" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-extrabold tracking-wide text-white leading-tight">Columbia Machine Brasil</h1>
                    <p class="text-[10px] sm:text-xs text-columbia-100">Controle de Produção V7.6.6</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto custom-scroll w-full lg:w-auto py-1">
                <div class="flex items-center gap-1 px-2.5 py-1.5 bg-columbia-800 border border-columbia-600 rounded-xl text-[11px] sm:text-xs font-bold text-slate-200 shrink-0">
                    <i data-lucide="user-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span id="userDisplayName">Usuário</span>
                </div>

                <button id="btnAbaDashboard" onclick="setAbaAtiva('dashboard')" class="flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-columbia-900 text-white font-extrabold rounded-xl text-[11px] sm:text-xs transition shadow-md border border-columbia-500 shrink-0">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span>Produção</span>
                </button>

                <button id="btnAbaFaturamento" onclick="setAbaAtiva('faturamento')" class="hidden flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-[11px] sm:text-xs transition shadow-md shrink-0">
                    <i data-lucide="package-check" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span>Faturamento</span>
                </button>

                <button id="btnAbaConferencia" onclick="setAbaAtiva('conferencia')" class="hidden flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl text-[11px] sm:text-xs transition shadow-md shrink-0">
                    <i data-lucide="clipboard-check" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span class="truncate">Conferência</span>
                </button>

                <button id="btnAbaAnexos" onclick="setAbaAtiva('anexos')" class="hidden flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-xl text-[11px] sm:text-xs transition shadow-md shrink-0">
                    <i data-lucide="paperclip" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span>Liberar Anexos</span>
                </button>

                <button id="btnVerLimbo" onclick="setAbaAtiva('limbo')" class="flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-[11px] sm:text-xs transition shadow-md shrink-0">
                    <i data-lucide="ghost" class="w-3.5 h-3.5"></i>
                    <span id="txtBtnLimbo">Limbo (0)</span>
                </button>

                <button id="btnToggleValues" onclick="handleValueVisibility()" class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-columbia-800 hover:bg-columbia-900 border border-columbia-600 text-white rounded-xl font-bold text-[11px] sm:text-xs transition shadow shrink-0">
                    <i data-lucide="eye-off" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-400" id="iconValueVisibility"></i>
                    <span id="txtValueVisibility" class="hidden sm:inline">Exibir Valores</span>
                </button>

                <button id="btnRefresh" onclick="fetchData(false)" class="flex items-center gap-1 px-2.5 sm:px-3.5 py-1.5 sm:py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-[11px] sm:text-xs transition-all shadow shrink-0" title="Atualizar Dados">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5 sm:w-4 sm:h-4" id="refreshIcon"></i>
                </button>

                <button onclick="efetuarLogout()" class="flex items-center gap-1 px-2.5 sm:px-3 py-1.5 sm:py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-[11px] sm:text-xs transition shadow shrink-0" title="Sair do Sistema">
                    <i data-lucide="log-out" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span class="hidden sm:inline">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- METRICS BAR -->
    <div id="metricsBar" class="bg-white border-b border-slate-200 text-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3">
            <div class="bg-slate-50 p-2.5 sm:p-3 rounded-xl border border-slate-200">
                <span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase block">Total de OS</span>
                <span id="metricTotalOS" class="text-base sm:text-xl font-extrabold text-columbia-700">0</span>
            </div>
            <div class="bg-slate-50 p-2.5 sm:p-3 rounded-xl border border-slate-200">
                <span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase block">OS Atrasadas</span>
                <span id="metricAtrasadas" class="text-base sm:text-xl font-extrabold text-red-600">0</span>
            </div>
            <div class="bg-slate-50 p-2.5 sm:p-3 rounded-xl border border-slate-200">
                <span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase block">Valor Geral Total</span>
                <span id="metricValorTotal" class="text-base sm:text-xl font-extrabold text-emerald-600">R$ *****</span>
            </div>
            <div class="bg-slate-50 p-2.5 sm:p-3 rounded-xl border border-slate-200">
                <span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase block">Sem Orçamento</span>
                <span id="metricSemOrcamento" class="text-xl font-extrabold text-amber-600">0</span>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <main class="max-w-7xl w-full mx-auto p-2.5 sm:p-4 flex flex-col gap-3 sm:gap-4 flex-1">
        <div id="filtersBar" class="bg-white p-2.5 sm:p-3.5 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-2 sm:gap-3 shadow-sm">
            <div class="flex items-center gap-2 flex-1 min-w-[180px] sm:min-w-[200px] bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <input type="search" id="searchInput" name="columbia_search_query" oninput="renderView()" 
                       placeholder="Pesquisar (OS, Título, Cliente, Origem, NF, Cod. Interno...)" 
                       class="w-full text-xs bg-transparent text-slate-800 focus:outline-none placeholder-slate-400 font-medium">
            </div>

            <div id="segmentoContainer" class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2">
                <i data-lucide="layers" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <select id="segmentoFilter" onchange="renderView()" class="text-xs bg-transparent text-slate-700 focus:outline-none cursor-pointer font-medium">
                    <option value="">Segmento (Todos)</option>
                </select>
            </div>

            <div id="clienteContainer" class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2">
                <i data-lucide="user" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <select id="clientFilter" onchange="renderView()" class="text-xs bg-transparent text-slate-700 focus:outline-none cursor-pointer font-medium">
                    <option value="">Todos os Clientes</option>
                </select>
            </div>
        </div>

        <div id="navigationBar" class="bg-white p-2.5 sm:p-3 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-2.5 shadow-sm">
            <div class="flex items-center bg-columbia-700 text-white rounded-xl px-2 py-1 shadow-sm">
                <button onclick="navigateDate(-1)" class="p-1 hover:bg-columbia-800 rounded-lg text-columbia-100 hover:text-white transition">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                
                <div class="flex items-center gap-2 px-2 sm:px-3">
                    <i data-lucide="calendar" class="w-4 h-4 text-columbia-100"></i>
                    <span id="currentDateLabel" class="font-bold text-xs capitalize tracking-wide min-w-[140px] text-center">Carregando...</span>
                </div>

                <button onclick="navigateDate(1)" class="p-1 hover:bg-columbia-800 rounded-lg text-columbia-100 hover:text-white transition">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>

                <button onclick="resetToToday()" class="ml-2 px-2.5 py-0.5 bg-white hover:bg-slate-100 rounded-lg text-xs font-bold text-columbia-800 transition shadow-sm">Hoje</button>
            </div>
        </div>

        <div id="calendarGrid" class="w-full"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 flex justify-between text-xs text-slate-500">
            <span>© 2026 Columbia Machine Brasil — V7.6.6</span>
        </div>
    </footer>

    <script>
        const API_URL = 'https://columbia.consultoriarf.net/producao';
        const API_HR_A_MAIS = 'https://columbia.consultoriarf.net/hr-a-mais';
        const API_FATURAMENTO = 'https://columbia.consultoriarf.net/faturamento_prod';

        let rawData = [];
        let rawConferenciaData = [];
        let rawFaturamentoData = [];
        let rawAnexosPendentes = [];
        let currentDate = new Date();
        let currentView = 'week';
        let abaAtiva = 'dashboard';
        let isValuesUnlocked = false;

        document.addEventListener('DOMContentLoaded', () => {
            const nomeUser = localStorage.getItem('columbia_usuario_nome');
            if (nomeUser) document.getElementById('userDisplayName').textContent = nomeUser;

            configurarVisibilidadeAbas();
            lucide.createIcons();
            fetchData();
            fetchFaturamentoData(true);
            fetchConferenciaData(true);

            setInterval(() => {
                if (abaAtiva === 'dashboard' || abaAtiva === 'limbo') fetchData(true);
                else if (abaAtiva === 'faturamento') fetchFaturamentoData(true);
                else if (abaAtiva === 'conferencia') fetchConferenciaData(true);
                else if (abaAtiva === 'anexos') fetchAnexosPendentData();
            }, 30000);
        });

        function setViewMode(mode, triggerRender = true) {
            currentView = 'week';
            if (triggerRender) renderView();
        }

        function setAbaAtiva(novaAba) {
            abaAtiva = novaAba;
            
            const metricsBar = document.getElementById('metricsBar');
            const filtersBar = document.getElementById('filtersBar');
            const navigationBar = document.getElementById('navigationBar');

            if (abaAtiva === 'dashboard') {
                if (metricsBar) metricsBar.classList.remove('hidden');
                if (filtersBar) filtersBar.classList.remove('hidden');
                if (navigationBar) navigationBar.classList.remove('hidden');
            } else if (abaAtiva === 'anexos') {
                if (metricsBar) metricsBar.classList.add('hidden');
                if (filtersBar) filtersBar.classList.remove('hidden');
                if (navigationBar) navigationBar.classList.add('hidden');
                fetchAnexosPendentData();
            } else if (abaAtiva === 'faturamento') {
                if (metricsBar) metricsBar.classList.add('hidden');
                if (filtersBar) filtersBar.classList.remove('hidden');
                if (navigationBar) navigationBar.classList.remove('hidden');
                fetchFaturamentoData();
            } else if (abaAtiva === 'conferencia') {
                if (metricsBar) metricsBar.classList.add('hidden');
                if (filtersBar) filtersBar.classList.add('hidden');
                if (navigationBar) navigationBar.classList.remove('hidden');
                fetchConferenciaData();
            } else if (abaAtiva === 'limbo') {
                if (metricsBar) metricsBar.classList.add('hidden');
                if (filtersBar) filtersBar.classList.add('hidden');
                if (navigationBar) navigationBar.classList.add('hidden');
            }

            renderView();
        }

        function configurarVisibilidadeAbas() {
            const valFaturamento = localStorage.getItem('columbia_perm_faturamento');
            const valFinalizacao = localStorage.getItem('columbia_perm_finalizacao');
            const valAnexo = localStorage.getItem('columbia_perm_anexo');

            document.getElementById('btnAbaFaturamento')?.classList.toggle('hidden', valFaturamento !== '1');
            document.getElementById('btnAbaConferencia')?.classList.toggle('hidden', valFinalizacao !== '1');
            document.getElementById('btnAbaAnexos')?.classList.toggle('hidden', valAnexo !== '1');
        }

        function renderView() {
            updateDateLabel();
            if (abaAtiva === 'dashboard') {
                renderDashboardView();
            } else if (abaAtiva === 'faturamento') {
                renderFaturamentoView();
            } else if (abaAtiva === 'conferencia') {
                renderConferenciaView();
            } else if (abaAtiva === 'limbo') {
                renderLimboView();
            } else if (abaAtiva === 'anexos') {
                renderPaginaAnexosView();
            }
            lucide.createIcons();
        }

        // RENDER DASHBOARD / PRODUÇÃO
        function renderDashboardView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            const filtered = rawData.filter(i => !i.u_limbo || i.u_limbo === 0);
            
            grid.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-md">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
                        ${filtered.map(item => `
                            <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-xs">
                                <span class="font-mono text-xs font-extrabold text-columbia-700">OS ${item.n_os}</span>
                                <h4 class="font-bold text-xs text-slate-800 mt-1">${item.titulo || 'SEM TÍTULO'}</h4>
                                <p class="text-[10px] text-slate-500 mt-2">Cliente: ${item.cliente || '-'}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // RENDER FATURAMENTO
        function renderFaturamentoView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            grid.innerHTML = `
                <div class="bg-white border border-blue-200 rounded-2xl p-4 shadow-md">
                    <h3 class="font-bold text-slate-800 text-sm mb-3">Resumo de Faturamento</h3>
                    <div class="space-y-2">
                        ${rawFaturamentoData.slice(0, 15).map(item => `
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-columbia-700">Orçamento: ${item.n_orcamento || '-'}</span>
                                    <p class="text-slate-600 font-medium">${item.cliente || 'CLIENTE NÃO INFORMADO'}</p>
                                </div>
                                <span class="font-mono font-bold text-emerald-600">R$ ${item.vl_faturado || '0,00'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // RENDER CONFERÊNCIA
        function renderConferenciaView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            grid.innerHTML = `
                <div class="bg-white border border-indigo-200 rounded-2xl p-4 shadow-md">
                    <h3 class="font-bold text-slate-800 text-sm mb-3">Conferência de Apontamentos (Horas a Mais)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${rawConferenciaData.slice(0, 12).map(item => `
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                                <span class="font-bold text-columbia-700">OS: ${item.cod_os_completo || item.n_os || '-'}</span>
                                <p class="text-slate-800 font-bold">👤 ${item.funcionario || 'N/A'}</p>
                                <p class="text-red-600 font-mono font-bold">Horas a mais: +${item.horas_a_mais || 0} hrs</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // RENDER LIMBO
        function renderLimboView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            const limboItems = rawData.filter(i => String(i.u_limbo) === '1' || i.u_limbo === 1);

            grid.innerHTML = `
                <div class="bg-white border border-amber-300 rounded-2xl p-4 shadow-md">
                    <h3 class="font-bold text-amber-900 text-sm mb-3">OSs no Limbo (${limboItems.length})</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${limboItems.map(item => `
                            <div class="bg-amber-50/50 border border-amber-200 p-3 rounded-xl text-xs">
                                <span class="font-bold text-amber-900">OS ${item.n_os}</span>
                                <p class="font-medium text-slate-700 mt-1">${item.titulo || 'Sem Título'}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // RENDER LIBERAR ANEXOS
        function renderPaginaAnexosView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            if (!rawAnexosPendentes || rawAnexosPendentes.length === 0) {
                grid.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400">
                        <i data-lucide="check-circle" class="w-10 h-10 text-emerald-400 mx-auto mb-2"></i>
                        <p class="text-xs font-bold text-slate-600">Não há nenhum anexo pendente para liberação no momento!</p>
                    </div>
                `;
                return;
            }

            const agrupadoPorOrcamento = {};
            rawAnexosPendentes.forEach(item => {
                const orc = item.n_orcamento;
                if (!agrupadoPorOrcamento[orc]) {
                    agrupadoPorOrcamento[orc] = { n_orcamento: orc, cliente: item.cliente, arquivos: [] };
                }
                agrupadoPorOrcamento[orc].arquivos.push(item);
            });

            let html = `
                <div class="bg-white rounded-2xl border border-teal-200 p-4 shadow-sm mb-4 flex justify-between items-center">
                    <h3 class="font-extrabold text-slate-900 text-sm">Anexos Pendentes de Liberação</h3>
                    <button onclick="liberarAnexosSelecionados()" class="px-3.5 py-2 bg-teal-600 text-white rounded-xl font-bold text-xs">Liberar Selecionados</button>
                </div>
                <div class="space-y-4">
            `;

            Object.values(agrupadoPorOrcamento).forEach(grupo => {
                html += `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="bg-slate-800 text-white px-4 py-2.5 flex justify-between items-center text-xs">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" onchange="toggleMarcarAnexosDoOrcamento(this, ${grupo.n_orcamento})" class="w-4 h-4 rounded text-teal-500 cursor-pointer">
                                <span class="font-bold text-teal-400">ORÇAMENTO Nº ${grupo.n_orcamento} - ${grupo.cliente}</span>
                            </div>
                        </div>

                        <div class="p-3 bg-slate-50/50 space-y-2">
                            ${grupo.arquivos.map(arq => {
                                const itemJson = JSON.stringify({
                                    cod_empresa: arq.cod_empresa,
                                    cod_os_principal: arq.cod_os_principal,
                                    cod_os_aux_principal: arq.cod_os_aux_principal,
                                    cod_os_origem_anexo: arq.cod_os_origem_anexo,
                                    cod_anexo: arq.cod_anexo
                                }).replace(/"/g, '&quot;');

                                const badgeOrigem = arq.origem_anexo === 'ESTRUTURA' 
                                    ? `<span class="bg-purple-100 text-purple-800 border border-purple-300 text-[9px] font-bold px-2 py-0.5 rounded-md">ESTRUTURA (OS ${arq.cod_os_origem_anexo})</span>`
                                    : `<span class="bg-blue-100 text-blue-800 border border-blue-300 text-[9px] font-bold px-2 py-0.5 rounded-md">OS PRINCIPAL</span>`;

                                return `
                                    <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                        <div class="flex items-center gap-3">
                                            <input type="checkbox" data-orcamento="${grupo.n_orcamento}" value="${itemJson}" class="chkAnexoItem w-4 h-4 rounded text-teal-600 cursor-pointer">
                                            <div>
                                                <div class="flex items-center gap-2 mb-0.5">
                                                    <span class="font-mono font-bold text-columbia-700">OS ${arq.cod_os_completo}</span>
                                                    ${badgeOrigem}
                                                </div>
                                                <p class="font-bold text-slate-800">${arq.nome_arquivo}</p>
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-2">
                                            <button onclick="visualizarAnexoPendente(event, ${arq.cod_empresa}, ${arq.cod_os_origem_anexo}, ${arq.cod_anexo})" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg font-bold text-[11px]">Ver Anexo</button>
                                            <button onclick="copiarAnexoParaDesenhos(event, ${arq.cod_empresa}, ${arq.cod_os_principal}, ${arq.cod_os_aux_principal}, ${arq.cod_os_origem_anexo}, ${arq.cod_anexo})" class="px-2.5 py-1 bg-amber-600 text-white rounded-lg font-bold text-[11px]">Copiar p/ Desenhos</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html + `</div>`;
        }

        function toggleMarcarAnexosDoOrcamento(masterChk, n_orcamento) {
            document.querySelectorAll(`.chkAnexoItem[data-orcamento="${n_orcamento}"]`).forEach(chk => chk.checked = masterChk.checked);
        }

        async function copiarAnexoParaDesenhos(event, cod_empresa, cod_os_principal, cod_os_aux_principal, cod_os_origem_anexo, cod_anexo) {
            if (event) event.stopPropagation();
            if (!confirm('Deseja copiar este anexo para a OS Principal e para a Estrutura?')) return;

            try {
                const response = await fetch(`${API_URL}/copiar-para-desenhos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cod_empresa, cod_os_principal, cod_os_aux_principal, cod_os_origem_anexo, cod_anexo })
                });
                if (response.ok) {
                    alert('Anexo copiado com sucesso!');
                    fetchAnexosPendentData();
                } else {
                    alert('Erro ao copiar anexo.');
                }
            } catch (e) { alert(e.message); }
        }

        async function liberarAnexosSelecionados() {
            const marcados = Array.from(document.querySelectorAll('.chkAnexoItem:checked')).map(chk => JSON.parse(chk.value));
            if (marcados.length === 0) return alert("Selecione pelo menos um anexo.");

            if (!confirm(`Deseja copiar e liberar os ${marcados.length} anexo(s) selecionados?`)) return;

            try {
                const response = await fetch(`${API_URL}/liberar-anexos-orcamento`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anexos: marcados })
                });
                if (response.ok) {
                    alert('Anexos liberados com sucesso!');
                    fetchAnexosPendentData();
                }
            } catch (e) { alert(e.message); }
        }

        async function visualizarAnexoPendente(event, cod_empresa, cod_os_origem_anexo, cod_anexo) {
            if (event) event.stopPropagation();
            try {
                const response = await fetch(`${API_URL}/anexo-visualizar?cod_empresa=${cod_empresa}&cod_os=${cod_os_origem_anexo}&cod_os_aux=1&codigo=${cod_anexo}`);
                const data = await response.json();
                if (data.pdf_base64) {
                    const byteCharacters = atob(data.pdf_base64);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
                    const fileBlob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
                    window.open(URL.createObjectURL(fileBlob), '_blank');
                }
            } catch (e) { alert('Erro ao abrir anexo.'); }
        }

        // CARREGAMENTO DE DADOS DAS APIS
        async function fetchData(isSilent = false) {
            try {
                const res = await fetch(`${API_URL}?_t=${Date.now()}`);
                if (res.ok) {
                    rawData = await res.json();
                    populateSelectOptions();
                    if (abaAtiva === 'dashboard' || abaAtiva === 'limbo') renderView();
                }
            } catch (e) { console.error(e); }
        }

        async function fetchFaturamentoData(isSilent = false) {
            try {
                const res = await fetch(`${API_FATURAMENTO}?_t=${Date.now()}`);
                if (res.ok) {
                    rawFaturamentoData = await res.json();
                    if (abaAtiva === 'faturamento') renderView();
                }
            } catch (e) { console.error(e); }
        }

        async function fetchConferenciaData(isSilent = false) {
            try {
                const res = await fetch(`${API_HR_A_MAIS}?_t=${Date.now()}`);
                if (res.ok) {
                    rawConferenciaData = await res.json();
                    if (abaAtiva === 'conferencia') renderView();
                }
            } catch (e) { console.error(e); }
        }

        async function fetchAnexosPendentData() {
            try {
                const res = await fetch(`${API_URL}/anexo?_t=${Date.now()}`);
                if (res.ok) {
                    rawAnexosPendentes = await res.json();
                    if (abaAtiva === 'anexos') renderView();
                }
            } catch (e) { console.error(e); }
        }

        function populateSelectOptions() {
            const seg = document.getElementById('segmentoFilter');
            const cli = document.getElementById('clientFilter');
            if (seg && rawData.length) {
                const opts = [...new Set(rawData.map(i => i.segmento).filter(Boolean))].sort();
                seg.innerHTML = '<option value="">Segmento (Todos)</option>' + opts.map(o => `<option value="${o}">${o}</option>`).join('');
            }
            if (cli && rawData.length) {
                const opts = [...new Set(rawData.map(i => i.cliente).filter(Boolean))].sort();
                cli.innerHTML = '<option value="">Todos os Clientes</option>' + opts.map(o => `<option value="${o}">${o}</option>`).join('');
            }
        }

        function updateDateLabel() {
            const label = document.getElementById('currentDateLabel');
            if (label) label.textContent = currentDate.toLocaleDateString('pt-BR');
        }

        function efetuarLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
