<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#003e7e">
  <title>Controle de Produção — Endereço desativado | Columbia</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f2741}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(140deg,#eaf1f8,#f7fafd);display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);border-radius:22px;background:white;border:1px solid #d8e3f0;box-shadow:0 15px 50px #003e7e15;text-align:center;padding:45px 30px}
    .mark{margin:0 auto 18px;width:64px;height:64px;display:grid;place-items:center;background:#edf5ff;border-radius:18px;color:#003e7e;font-size:30px}
    h1{font-size:clamp(24px,4.5vw,34px);margin:0 0 16px;color:#003e7e}
    p{line-height:1.65;margin:0 0 16px;color:#526579}
    a{display:inline-block;margin-top:12px;border-radius:11px;background:#003e7e;color:white;font-weight:800;padding:15px 24px;text-decoration:none}
    a:hover{background:#002e61}
    .note{font-size:13px;color:#64748b;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1>Link desativado</h1>
    <p>O Controle de Produção da Columbia foi integrado ao portal principal.</p>
    <p>O acesso agora é feito pelo menu <strong>Columbia Machine Brasil</strong>, utilizando o login único e a permissão <strong>PCP</strong>.</p>
    <a href="https://consultoriarf.net/columbia/">Acessar consultoriarf.net/columbia</a>
    <p class="note">Depois do login, selecione <strong>Controle de Produção</strong>.</p>
  </main>
</body>
</html>
